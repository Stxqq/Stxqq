<title>Jewel CD Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen car head-unit app: 3D jewel case centre stage, now-playing line, floating dock below. */
:root {
  --bg: #eef0f3;
  --bg-glow: #ffffff;
  --fg: #15171c;
  --muted: #7a7f8b;
  --surface: #ffffff;
  --ink: #111318;
  --ink-fg: #ffffff;
  --line: rgba(40, 46, 60, .42);
  --line-soft: rgba(40, 46, 60, .16);
  --glass: rgba(255, 255, 255, .34);
  --glass-hi: rgba(255, 255, 255, .85);
  --shadow: rgba(30, 36, 50, .28);
  --dock-shadow: 0 10px 30px rgba(20, 24, 34, .12), 0 1px 0 rgba(20, 24, 34, .05);
  --danger: #c02639;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c0f; --bg-glow: #1b1e25; --fg: #eef0f4; --muted: #8a909c; --surface: #1a1d23;
    --ink: #f2f3f6; --ink-fg: #0b0c0f; --line: rgba(225, 232, 245, .48); --line-soft: rgba(225, 232, 245, .16);
    --glass: rgba(200, 210, 230, .08); --glass-hi: rgba(255, 255, 255, .35); --shadow: rgba(0, 0, 0, .7);
    --dock-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06); --danger: #ff6b7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c0f; --bg-glow: #1b1e25; --fg: #eef0f4; --muted: #8a909c; --surface: #1a1d23;
  --ink: #f2f3f6; --ink-fg: #0b0c0f; --line: rgba(225, 232, 245, .48); --line-soft: rgba(225, 232, 245, .16);
  --glass: rgba(200, 210, 230, .08); --glass-hi: rgba(255, 255, 255, .35); --shadow: rgba(0, 0, 0, .7);
  --dock-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06); --danger: #ff6b7c;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 38%, var(--bg-glow), var(--bg) 70%) var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding-inline: 16px; padding-block: 12px 16px;
  gap: 10px;
  box-sizing: border-box;
}

/* ---------- stage & case ---------- */
.stage {
  flex: 1; min-height: 0; width: 100%;
  container-type: size;
  display: grid; place-items: center;
  perspective: 1500px;
}
.rig {
  --s: min(74cqh, 82cqw, 470px);
  --d: calc(var(--s) * .04);
  width: var(--s); height: var(--s);
  position: relative;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.6, 0, .3, 1), opacity .5s;
}
.rig.out-up { transform: translateY(-115cqh) rotateZ(-8deg); opacity: 0; }
.rig.from-below { transform: translateY(115cqh) rotateZ(6deg); opacity: 0; transition: none; }
.floor {
  position: absolute; left: 8%; right: 8%; bottom: -9%; height: 18%;
  background: radial-gradient(ellipse at center, var(--shadow), transparent 68%);
  filter: blur(10px);
  pointer-events: none;
}
.case {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  cursor: grab; touch-action: none;
  outline: none;
}
.case:active { cursor: grabbing; }
.case:focus-visible .lid { box-shadow: 0 0 0 3px var(--ink); }

.panel {
  position: absolute; inset: 0;
  border: 1.5px solid var(--line);
  border-radius: 2.6%;
}
.tray {
  transform: translateZ(calc(var(--d) * -.5));
  background:
    linear-gradient(150deg, var(--glass-hi), transparent 22%, transparent 70%, var(--glass) 100%),
    var(--glass);
  box-shadow: inset 0 0 0 calc(var(--s) * .028) var(--glass), inset 0 0 0 calc(var(--s) * .028 + 1.5px) var(--line-soft);
}
/* inner rails of the tray */
.tray::before, .lid::before {
  content: ""; position: absolute; inset: 4.5%;
  border: 1.5px solid var(--line-soft);
  border-radius: 2%;
}
.bracket {
  position: absolute; width: 13%; height: 13%;
  border: 2px solid var(--line);
  border-right: 0; border-bottom: 0;
  border-radius: 6px 0 0 0;
}
.bracket.tl { left: 7%; top: 7%; }
.bracket.tr { right: 7%; top: 7%; transform: rotate(90deg); }
.bracket.br { right: 7%; bottom: 7%; transform: rotate(180deg); }
.bracket.bl { left: 7%; bottom: 7%; transform: rotate(270deg); }
.tray-hub {
  position: absolute; left: 50%; top: 50%; width: 16%; height: 16%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: repeating-radial-gradient(circle, transparent 0 3px, var(--line-soft) 3px 4px);
}

.edge {
  position: absolute;
  background: var(--glass);
  border: 1px solid var(--line);
  box-sizing: border-box;
}
.edge.t { left: 0; top: calc(var(--d) * -.5); width: 100%; height: var(--d); transform: rotateX(90deg); }
.edge.b { left: 0; bottom: calc(var(--d) * -.5); width: 100%; height: var(--d); transform: rotateX(90deg); }
.edge.l { top: 0; left: calc(var(--d) * -.5); height: 100%; width: var(--d); transform: rotateY(90deg); }
.edge.r { top: 0; right: calc(var(--d) * -.5); height: 100%; width: var(--d); transform: rotateY(90deg); }

/* disc */
.disc {
  position: absolute; left: 8%; top: 8%; width: 84%; height: 84%;
  border-radius: 50%;
  transform: translateZ(calc(var(--d) * -.5 + 3px));
  transform-style: preserve-3d;
}
.disc-art, .disc-sheen {
  position: absolute; inset: 0; border-radius: 50%;
  -webkit-mask: radial-gradient(circle, transparent 0 6.6%, #000 7.1%);
          mask: radial-gradient(circle, transparent 0 6.6%, #000 7.1%);
}
.disc-art {
  background: #888 center / cover no-repeat;
  background-image: var(--cover);
  box-shadow: 0 0 0 1.5px var(--line), inset 0 0 0 3px rgba(255, 255, 255, .35);
  animation: spin 2.2s linear infinite;
  animation-play-state: paused;
}
.playing .disc-art { animation-play-state: running; }
.disc-sheen {
  background:
    conic-gradient(from 30deg,
      rgba(255,255,255,0) 0deg, rgba(255,255,255,.38) 22deg, rgba(160,220,255,.18) 34deg, rgba(255,255,255,0) 60deg,
      rgba(255,255,255,0) 180deg, rgba(255,255,255,.3) 204deg, rgba(255,170,210,.16) 216deg, rgba(255,255,255,0) 244deg);
  mix-blend-mode: screen;
  pointer-events: none;
}
.disc-hub {
  position: absolute; left: 50%; top: 50%; width: 32%; height: 32%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle,
    transparent 0 21%, var(--line) 21.5% 23%,
    rgba(255,255,255,.42) 23.5% 44%, var(--line) 44.5% 46%,
    rgba(255,255,255,.22) 46.5% 70%, var(--line) 70.5% 72%,
    rgba(255,255,255,.1) 72.5% 98%, var(--line) 98.5%);
  backdrop-filter: blur(1px);
}
.disc-hub::before, .disc-hub::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 6%; height: 6%; border-radius: 50%;
  border: 1.5px solid var(--line);
  transform: translate(-50%, -50%) translateY(-290%);
  box-shadow: 0 calc(var(--s) * .0 + 580%) 0 0 transparent;
}
.disc-hub::after { transform: translate(-50%, -50%) translateY(290%); }

/* lid */
.lid {
  transform-origin: left center;
  transform: translateZ(calc(var(--d) * .5)) rotateY(0deg);
  transition: transform .95s cubic-bezier(.2, .85, .25, 1);
  background:
    linear-gradient(125deg, var(--glass-hi) 0%, transparent 18%, transparent 46%, rgba(255,255,255,.22) 52%, transparent 60%, transparent 100%),
    rgba(255, 255, 255, .06);
}
.open .lid { transform: translateZ(calc(var(--d) * .5)) rotateY(-158deg); }
.hinge {
  position: absolute; left: -1.5px; width: 4.5%; height: 9%;
  border: 1.5px solid var(--line); border-left: 0;
  border-radius: 0 4px 4px 0;
  background: var(--glass);
}
.hinge.a { top: 12%; }
.hinge.b { bottom: 12%; }
.latch {
  position: absolute; right: -1.5px; top: 42%; height: 16%; width: 3.5%;
  border: 1.5px solid var(--line); border-right: 0;
  border-radius: 4px 0 0 4px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- now playing ---------- */
.hint {
  font-size: .78rem; color: var(--muted); letter-spacing: .02em;
  margin: 0; text-align: center;
}
.np {
  width: min(560px, 100%);
  display: grid; grid-template-columns: 1fr; gap: 6px;
  text-align: center;
}
.np-cd {
  font-family: var(--font-mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
}
.np-title {
  margin: 0; font-size: clamp(1.15rem, 2.6vw, 1.5rem); font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar { display: grid; grid-template-columns: 3.2em 1fr 3.2em; align-items: center; gap: 10px; }
.bar span { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar span:last-child { text-align: right; }
.progress {
  height: 4px; border-radius: 4px; background: var(--line-soft); position: relative; cursor: pointer;
}
.progress::after { content: ""; position: absolute; inset: -12px 0; }
.progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: var(--fg); }

/* ---------- dock ---------- */
.dock {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px;
  background: var(--surface);
  border-radius: 999px;
  box-shadow: var(--dock-shadow);
  max-width: 100%;
  overflow-x: auto; scrollbar-width: none;
  flex-shrink: 0;
}
.dock::-webkit-scrollbar { display: none; }
.thumbs { display: flex; gap: 4px; }
.thumb, .ctl {
  flex: 0 0 auto;
  width: 50px; height: 50px; border-radius: 50%;
  border: 0; padding: 0; background: transparent; color: var(--fg);
  display: grid; place-items: center; cursor: pointer;
  position: relative;
}
.thumb i {
  width: 36px; height: 36px; border-radius: 50%;
  background: #999 center / cover; background-image: var(--cover);
  box-shadow: 0 0 0 1px var(--line-soft);
  -webkit-mask: radial-gradient(circle, transparent 0 4px, #000 4.5px);
          mask: radial-gradient(circle, transparent 0 4px, #000 4.5px);
  transition: transform .25s;
}
.thumb:hover i { transform: scale(1.08); }
.thumb[aria-current="true"]::after {
  content: ""; position: absolute; bottom: 1px; left: 50%; width: 14px; height: 2.5px; margin-left: -7px;
  border-radius: 2px; background: var(--fg);
}
.sep { width: 1px; height: 28px; background: var(--line-soft); margin-inline: 4px; flex: 0 0 auto; }
.ctl svg { width: 22px; height: 22px; fill: currentColor; }
.ctl.play { background: var(--ink); color: var(--ink-fg); }
.ctl.add { color: var(--muted); }
.ctl:hover:not(.play) { background: var(--line-soft); }
.thumb:focus-visible, .ctl:focus-visible, .btn:focus-visible, .field input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* ---------- add sheet ---------- */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  padding-inline: 16px;
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  backdrop-filter: blur(6px);
}
.sheet {
  width: min(440px, 100%);
  max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--surface); border-radius: 18px; box-shadow: var(--dock-shadow);
  padding: 20px; box-sizing: border-box;
  display: grid; gap: 14px;
  user-select: text;
}
.sheet h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
.sheet p { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.45; }
.field { display: grid; gap: 6px; font-size: .8rem; font-weight: 500; }
.field input[type="text"] {
  font: inherit; font-size: .95rem; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line-soft); background: var(--bg); color: var(--fg);
}
.field input[type="file"] { font: inherit; font-size: .8rem; color: var(--muted); }
.row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn {
  font: inherit; font-size: .9rem; font-weight: 600; padding: 10px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line-soft); background: transparent; color: var(--fg);
}
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.err { color: var(--danger); font-size: .8rem; min-height: 1em; }
.own { display: grid; gap: 6px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.own h3 { margin: 0; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.own-item { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.own-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.own-item button { font: inherit; font-size: .8rem; color: var(--danger); background: none; border: 0; cursor: pointer; padding: 6px; }

@media (max-height: 520px) { .hint { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .disc-art { animation: none; }
  .rig, .lid { transition-duration: .01s; }
}
</style>

<main class="app" id="app">
  <section class="stage" aria-label="CD-Hülle">
    <div class="rig" id="rig">
      <div class="floor"></div>
      <div class="case" id="case" tabindex="0" role="button" aria-label="Hülle öffnen und abspielen">
        <div class="edge t"></div><div class="edge b"></div><div class="edge l"></div><div class="edge r"></div>
        <div class="panel tray">
          <span class="bracket tl"></span><span class="bracket tr"></span><span class="bracket br"></span><span class="bracket bl"></span>
          <span class="tray-hub"></span>
        </div>
        <div class="disc" id="disc">
          <div class="disc-art" id="discArt"></div>
          <div class="disc-sheen"></div>
          <div class="disc-hub"></div>
        </div>
        <div class="panel lid">
          <span class="hinge a"></span><span class="hinge b"></span><span class="latch"></span>
        </div>
      </div>
    </div>
  </section>

  <p class="hint" id="hint">Tippe auf die Hülle zum Öffnen · Ziehen zum Drehen</p>

  <section class="np" aria-live="polite">
    <div class="np-cd" id="npCd">Fluid · Demo-CD</div>
    <h1 class="np-title" id="npTitle">Nachtfahrt</h1>
    <div class="bar">
      <span id="tCur">0:00</span>
      <div class="progress" id="progress" role="slider" aria-label="Position im Song" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="progress-fill" id="fill"></div></div>
      <span id="tDur">0:00</span>
    </div>
  </section>

  <nav class="dock" aria-label="CDs und Wiedergabe">
    <div class="thumbs" id="thumbs"></div>
    <button class="ctl add" id="addBtn" aria-label="Eigene CD hinzufügen" title="Eigene CD hinzufügen">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <span class="sep"></span>
    <button class="ctl" id="prevBtn" aria-label="Vorheriger Song">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
    </button>
    <button class="ctl play" id="playBtn" aria-label="Abspielen">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctl" id="nextBtn" aria-label="Nächster Song">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </nav>
</main>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <form class="sheet" id="sheet" novalidate>
    <h2>Eigene CD brennen</h2>
    <p>Wähle ein Playlist-Cover und deine Songs. Das Cover wird auf die CD gedruckt.</p>
    <label class="field">Name der Playlist
      <input type="text" id="cdName" maxlength="40" placeholder="z. B. Sommer 2026">
    </label>
    <label class="field">Cover (Bild)
      <input type="file" id="cdCover" accept="image/*">
    </label>
    <label class="field">Songs (MP3, M4A …)
      <input type="file" id="cdSongs" accept="audio/*" multiple>
    </label>
    <div class="err" id="err"></div>
    <div class="row">
      <button type="button" class="btn" id="cancelBtn">Abbrechen</button>
      <button type="submit" class="btn primary">CD erstellen</button>
    </div>
    <div class="own" id="ownBox" hidden>
      <h3>Deine CDs</h3>
      <div id="ownList"></div>
    </div>
  </form>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= covers ================= */
  function canvas(size) { const c = document.createElement('canvas'); c.width = c.height = size; return c; }

  function coverFluid() {
    const S = 300, c = canvas(S), g = c.getContext('2d'), img = g.createImageData(S, S);
    const stops = [[10,14,52],[32,64,214],[246,240,230],[255,128,30],[214,30,44],[18,8,12],[10,14,52]];
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      let u = (x / S - .5) * 3.2, v = (y / S - .5) * 3.2;
      for (let k = 0; k < 5; k++) { u += .55 * Math.sin(v * 1.6 + k * 1.3); v += .55 * Math.cos(u * 1.4 - k * .9); }
      let t = (Math.sin(u * 1.3 + v * .7) * .5 + .5) * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i, a = stops[i], b = stops[i + 1];
      const hl = Math.pow(Math.max(0, Math.sin(u * 2.4 - v * 1.7)), 24) * 140;
      const o = (y * S + x) * 4;
      img.data[o] = Math.min(255, a[0] + (b[0] - a[0]) * f + hl);
      img.data[o + 1] = Math.min(255, a[1] + (b[1] - a[1]) * f + hl);
      img.data[o + 2] = Math.min(255, a[2] + (b[2] - a[2]) * f + hl);
      img.data[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL('image/jpeg', .9);
  }

  function coverRose() {
    const S = 400, c = canvas(S), g = c.getContext('2d'), m = S / 2;
    const bg = g.createRadialGradient(m, m, 0, m, m, m);
    bg.addColorStop(0, '#2a0a0e'); bg.addColorStop(1, '#070304');
    g.fillStyle = bg; g.fillRect(0, 0, S, S);
    const N = 38;
    for (let i = N; i >= 0; i--) {
      const t = i / N, r = S * (.05 + t * .42), ang = i * 2.39996, span = 3.4 - t * 1.6;
      g.save(); g.translate(m, m); g.rotate(ang);
      const grad = g.createRadialGradient(0, 0, r * .2, 0, 0, r);
      grad.addColorStop(0, '#3d0309'); grad.addColorStop(.7, '#b30f22'); grad.addColorStop(1, '#ee3445');
      g.fillStyle = grad;
      g.shadowColor = 'rgba(0,0,0,.65)'; g.shadowBlur = 22;
      g.beginPath();
      g.arc(0, 0, r, -span / 2, span / 2);
      g.quadraticCurveTo(r * .35, 0, Math.cos(-span / 2) * r, Math.sin(-span / 2) * r);
      g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = 'rgba(255,140,150,.28)'; g.lineWidth = 1.2;
      g.beginPath(); g.arc(0, 0, r, -span / 2, span / 2); g.stroke();
      g.restore();
    }
    return c.toDataURL('image/jpeg', .9);
  }

  function coverChrome() {
    const S = 400, c = canvas(S), g = c.getContext('2d'), m = S / 2;
    if (g.createConicGradient) {
      const cg = g.createConicGradient(.4, m, m);
      [['#d9dde3',0],['#8d939c',.12],['#f4f6f8',.22],['#c8b6d8',.3],['#9aa1ab',.42],['#eef1f4',.55],['#a5d6dc',.62],['#7f858e',.75],['#f2f3f5',.88],['#d9dde3',1]]
        .forEach(([col, p]) => cg.addColorStop(p, col));
      g.fillStyle = cg;
    } else g.fillStyle = '#c9cdd3';
    g.fillRect(0, 0, S, S);
    g.strokeStyle = 'rgba(0,0,0,.05)';
    for (let r = 20; r < m; r += 3) { g.beginPath(); g.arc(m, m, r, 0, 7); g.stroke(); }
    return c.toDataURL('image/jpeg', .9);
  }

  function coverNight() {
    const S = 400, c = canvas(S), g = c.getContext('2d'), m = S / 2;
    const bg = g.createLinearGradient(0, 0, 0, S);
    bg.addColorStop(0, '#05081a'); bg.addColorStop(.62, '#17245a'); bg.addColorStop(.63, '#ff8a3d'); bg.addColorStop(.66, '#1a1030'); bg.addColorStop(1, '#06040c');
    g.fillStyle = bg; g.fillRect(0, 0, S, S);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 220; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * .8})`; g.fillRect(rnd() * S, rnd() * S * .6, 1.4, 1.4); }
    g.strokeStyle = 'rgba(255,170,90,.5)'; g.lineWidth = 1.5;
    for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo(m, S * .64); g.lineTo((i - 4) * S * .35 + m, S); g.stroke(); }
    return c.toDataURL('image/jpeg', .9);
  }

  function coverFromName(name) {
    const S = 300, c = canvas(S), g = c.getContext('2d');
    let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
    const gr = g.createLinearGradient(0, 0, S, S);
    gr.addColorStop(0, `hsl(${h} 70% 55%)`); gr.addColorStop(1, `hsl(${(h + 70) % 360} 70% 30%)`);
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    return c.toDataURL('image/jpeg', .9);
  }

  /* ================= demo CDs ================= */
  const DEMO = [
    { id: 'fluid', name: 'Fluid', cover: coverFluid(),
      style: { bpm: 100, key: 57, mode: 'minor', prog: [0, 5, 3, 4], pad: 'sawtooth', cutoff: 2600, arp: 'square',
               kick: [0, 8], snare: [4, 12], hat: [0, 2, 4, 6, 8, 10, 12, 14], bass: [0, 2, 4, 6, 8, 10, 12, 14] },
      tracks: ['Nachtfahrt', 'Neonband', 'Autobahn, 3 Uhr'] },
    { id: 'rose', name: 'Rose', cover: coverRose(),
      style: { bpm: 76, key: 53, mode: 'major', prog: [1, 4, 0, 5], seventh: true, pad: 'triangle', cutoff: 1500, arp: 'triangle', swing: .2,
               kick: [0, 7, 10], snare: [4, 12], hat: [0, 2, 4, 6, 8, 10, 12, 14], bass: [0, 7, 10] },
      tracks: ['Rosenrot', 'Samstagmorgen', 'Kaffee und Regen'] },
    { id: 'chrome', name: 'Chrom', cover: coverChrome(),
      style: { bpm: 122, key: 48, mode: 'minor', prog: [0, 0, 5, 6], pad: 'square', cutoff: 2200, arp: 'sawtooth',
               kick: [0, 4, 8, 12], snare: [4, 12], hat: [2, 6, 10, 14], bass: [2, 6, 10, 14] },
      tracks: ['Chromglanz', 'Tiefgarage', 'Spiegelbild'] },
    { id: 'night', name: 'Heimweg', cover: coverNight(),
      style: { bpm: 62, key: 50, mode: 'major', prog: [0, 4, 5, 3], seventh: true, pad: 'sine', cutoff: 2400, arp: 'sine',
               kick: [], snare: [], hat: [], bass: [0] },
      tracks: ['Sternfeld', 'Leiser Motor', 'Letzte Ausfahrt'] },
  ].map(cd => ({ ...cd, demo: true,
    tracks: cd.tracks.map((title, k) => ({ title, synth: { ...cd.style, key: cd.style.key + [0, -2, 3][k], rot: k, seed: k + 1 }, duration: 150 + k * 22 })) }));

  let cds = [...DEMO];

  /* ================= synth engine ================= */
  let actx = null, master = null, noiseBuf = null;
  function ensureCtx() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      master = actx.createGain(); master.gain.value = .55;
      master.connect(comp); comp.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11] };

  class Synth {
    constructor(def, offset) {
      this.def = def;
      this.bus = actx.createGain(); this.bus.gain.value = 0;
      this.filter = actx.createBiquadFilter(); this.filter.type = 'lowpass'; this.filter.frequency.value = def.cutoff;
      this.delay = actx.createDelay(1); this.delay.delayTime.value = 60 / def.bpm * .75;
      const fb = actx.createGain(); fb.gain.value = .32;
      this.delay.connect(fb); fb.connect(this.delay); this.delay.connect(this.filter);
      this.bus.connect(this.filter); this.filter.connect(master);
      this.bus.gain.setTargetAtTime(1, actx.currentTime, .15);
      this.spb = 60 / def.bpm / 4;
      this.startAt = actx.currentTime - offset;
      this.step = Math.floor(offset / this.spb);
      this.next = actx.currentTime + .05;
      let s = def.seed * 9301; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      this.arpMask = Array.from({ length: 16 }, () => rnd() > .45);
      this.arpI = 0;
      this.timer = setInterval(() => this.tick(), 25);
    }
    elapsed() { return actx.currentTime - this.startAt; }
    stop() {
      clearInterval(this.timer);
      const bus = this.bus, f = this.filter;
      bus.gain.cancelScheduledValues(actx.currentTime);
      bus.gain.setTargetAtTime(0, actx.currentTime, .08);
      setTimeout(() => { try { f.disconnect(); } catch (e) {} }, 2500);
    }
    chord(bar) {
      const d = this.def, sc = SCALES[d.mode], deg = d.prog[(bar + d.rot) % d.prog.length];
      const pick = (n) => d.key + sc[n % 7] + 12 * Math.floor(n / 7);
      const notes = [pick(deg), pick(deg + 2), pick(deg + 4)];
      if (d.seventh) notes.push(pick(deg + 6));
      return notes;
    }
    tick() {
      while (this.next < actx.currentTime + .12) {
        const st = this.step % 16, swing = (st % 2 && this.def.swing) ? this.def.swing * this.spb : 0;
        this.play(this.step, this.next + swing);
        this.next += this.spb; this.step++;
      }
    }
    play(step, t) {
      const d = this.def, st = step % 16, bar = Math.floor(step / 16), ch = this.chord(bar), barDur = this.spb * 16;
      if (st === 0) ch.forEach(n => this.voice(n, t, barDur, d.pad, .045));
      if (d.bass.includes(st)) this.voice(ch[0] - 24, t, this.spb * (d.bass.length < 4 ? 6 : 1.6), 'triangle', .22, .005);
      if (this.arpMask[st] && bar % 4 !== 3) {
        const n = ch[this.arpI++ % ch.length] + 12 + (st > 11 ? 12 : 0);
        this.voice(n, t, this.spb * 1.2, d.arp, .05, .004, true);
      }
      if (d.kick.includes(st)) this.kick(t);
      if (d.snare.includes(st)) this.noise(t, 'bandpass', 1800, .3, .16);
      if (d.hat.includes(st)) this.noise(t, 'highpass', 7500, st % 4 === 2 ? .07 : .04, .045);
    }
    voice(midi, t, dur, type, vol, att = .25, send = false) {
      const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
      o.type = o2.type = type; o.frequency.value = o2.frequency.value = mtof(midi); o2.detune.value = 9;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + att);
      g.gain.exponentialRampToValueAtTime(.0005, t + dur);
      o.connect(g); o2.connect(g); g.connect(this.bus); if (send) g.connect(this.delay);
      o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
    }
    kick(t) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
      g.gain.setValueAtTime(.95, t); g.gain.exponentialRampToValueAtTime(.001, t + .38);
      o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + .4);
    }
    noise(t, type, freq, vol, dur) {
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.bus); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
    }
  }

  /* ================= player ================= */
  const audio = new Audio();
  audio.preload = 'auto';
  const state = { cd: 0, track: 0, playing: false, open: false, synth: null, synthOffset: 0 };
  const curCd = () => cds[state.cd];
  const curTrack = () => curCd().tracks[state.track];

  function elapsed() {
    const t = curTrack();
    if (t.synth) return state.synth ? state.synth.elapsed() : state.synthOffset;
    return audio.currentTime || 0;
  }
  function duration() {
    const t = curTrack();
    if (t.synth) return t.duration;
    return isFinite(audio.duration) ? audio.duration : 0;
  }

  function loadTrack() {
    stopSound();
    state.synthOffset = 0;
    const t = curTrack();
    if (!t.synth) { audio.src = t.url; audio.load(); }
    renderInfo();
  }
  function stopSound() {
    if (state.synth) { state.synthOffset = state.synth.elapsed(); state.synth.stop(); state.synth = null; }
    audio.pause();
  }
  function startSound() {
    const t = curTrack();
    if (t.synth) { ensureCtx(); state.synth = new Synth(t.synth, state.synthOffset); }
    else audio.play().catch(() => setPlaying(false));
  }
  function setPlaying(on) {
    if (on === state.playing) return;
    state.playing = on;
    if (on) { setOpen(true); startSound(); wake(true); }
    else { stopSound(); wake(false); }
    $('app').classList.toggle('playing', on);
    $('playIcon').innerHTML = on ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $('playBtn').setAttribute('aria-label', on ? 'Pause' : 'Abspielen');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
  }
  function setOpen(on) {
    state.open = on;
    $('case').classList.toggle('open', on);
    $('case').setAttribute('aria-label', on ? 'Hülle schließen und pausieren' : 'Hülle öffnen und abspielen');
    $('hint').textContent = on ? 'Tippe auf die Hülle zum Schließen · Ziehen zum Drehen' : 'Tippe auf die Hülle zum Öffnen · Ziehen zum Drehen';
  }
  function step(dir) {
    const n = curCd().tracks.length;
    if (dir < 0 && elapsed() > 4) { seek(0); return; }
    const was = state.playing;
    if (was) stopSound();
    state.track = (state.track + dir + n) % n;
    loadTrack();
    if (was) startSound();
  }
  function seek(sec) {
    const t = curTrack(), was = state.playing;
    if (t.synth) { if (was) stopSound(); state.synthOffset = sec; if (was) startSound(); }
    else if (isFinite(audio.duration)) audio.currentTime = sec;
  }
  audio.addEventListener('ended', () => step(1));

  let wakeLock = null;
  async function wake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }

  /* ================= rendering ================= */
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function renderInfo() {
    const cd = curCd(), t = curTrack();
    $('npCd').textContent = `${cd.name} · ${cd.demo ? 'Demo-CD' : 'Eigene CD'} · ${state.track + 1}/${cd.tracks.length}`;
    $('npTitle').textContent = t.title;
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: cd.name, album: cd.name, artwork: [{ src: cd.cover, sizes: '400x400' }] }); } catch (e) {}
    }
  }
  function renderCase() { $('discArt').style.setProperty('--cover', `url("${curCd().cover}")`); }
  function renderThumbs() {
    const box = $('thumbs'); box.textContent = '';
    cds.forEach((cd, i) => {
      const b = document.createElement('button');
      b.className = 'thumb'; b.setAttribute('aria-label', `CD ${cd.name}`); b.title = cd.name;
      b.setAttribute('aria-current', i === state.cd ? 'true' : 'false');
      const ic = document.createElement('i'); ic.style.setProperty('--cover', `url("${cd.cover}")`);
      b.appendChild(ic); b.addEventListener('click', () => switchCd(i));
      box.appendChild(b);
    });
  }
  function tickUi() {
    const e = elapsed(), d = duration();
    if (curTrack().synth && state.playing && e >= d) step(1);
    $('tCur').textContent = fmt(e); $('tDur').textContent = fmt(d);
    const p = d ? Math.min(100, e / d * 100) : 0;
    $('fill').style.width = p + '%'; $('progress').setAttribute('aria-valuenow', Math.round(p));
  }
  setInterval(tickUi, 250);

  let switching = false;
  function switchCd(i) {
    if (i === state.cd || switching) return;
    const was = state.playing, rig = $('rig');
    setPlaying(false); setOpen(false);
    switching = true;
    const swap = () => {
      state.cd = i; state.track = 0;
      renderCase(); loadTrack(); renderThumbs();
      rig.classList.remove('out-up'); rig.classList.add('from-below');
      void rig.offsetWidth;
      rig.classList.remove('from-below');
      setTimeout(() => { switching = false; if (was) setPlaying(true); }, reduced ? 0 : 650);
    };
    if (reduced) { swap(); return; }
    rig.classList.add('out-up');
    setTimeout(swap, 480);
  }

  /* ================= drag to turn ================= */
  const pose = { rx: 10, ry: -16, vx: 0, vy: 0, drag: null };
  const caseEl = $('case');
  caseEl.addEventListener('pointerdown', (e) => {
    caseEl.setPointerCapture(e.pointerId);
    pose.drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0 };
    pose.vx = pose.vy = 0;
  });
  caseEl.addEventListener('pointermove', (e) => {
    const d = pose.drag; if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    d.x = e.clientX; d.y = e.clientY;
    d.moved = Math.max(d.moved, Math.hypot(e.clientX - d.sx, e.clientY - d.sy));
    pose.ry += dx * .45; pose.rx = Math.max(-70, Math.min(70, pose.rx - dy * .45));
    pose.vx = dx * .45; pose.vy = -dy * .45;
  });
  const endDrag = () => {
    const d = pose.drag; pose.drag = null;
    if (d && d.moved < 7) toggleCase();
  };
  caseEl.addEventListener('pointerup', endDrag);
  caseEl.addEventListener('pointercancel', () => { pose.drag = null; });
  caseEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCase(); } });

  function toggleCase() {
    if (state.open) { setPlaying(false); setOpen(false); }
    else setPlaying(true);
  }

  function frame(now) {
    if (!pose.drag) {
      pose.ry += pose.vx; pose.rx = Math.max(-70, Math.min(70, pose.rx + pose.vy));
      pose.vx *= .93; pose.vy *= .93;
    }
    const bob = reduced ? 0 : Math.sin(now / 1400) * 2;
    caseEl.style.transform = `rotateX(${pose.rx + bob}deg) rotateY(${pose.ry + bob * .6}deg)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= controls ================= */
  $('playBtn').addEventListener('click', () => setPlaying(!state.playing));
  $('nextBtn').addEventListener('click', () => step(1));
  $('prevBtn').addEventListener('click', () => step(-1));
  $('progress').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    seek(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * duration());
  });
  $('progress').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') seek(Math.min(duration(), elapsed() + 10));
    if (e.key === 'ArrowLeft') seek(Math.max(0, elapsed() - 10));
  });
  document.addEventListener('keydown', (e) => {
    if (!$('sheetWrap').hidden || e.target.closest('input, .progress, .case')) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!state.playing); }
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', () => setPlaying(true));
      ms.setActionHandler('pause', () => setPlaying(false));
      ms.setActionHandler('nexttrack', () => step(1));
      ms.setActionHandler('previoustrack', () => step(-1));
    } catch (e) {}
  }

  /* ================= own CDs (IndexedDB) ================= */
  const DB = 'jewel-cd', STORE = 'cds';
  function db() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  async function dbAll() {
    try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction(STORE).objectStore(STORE).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch (e) { return []; }
  }
  async function dbPut(rec) {
    try { const d = await db(); await new Promise((res, rej) => { const tx = d.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; }
    catch (e) { return false; }
  }
  async function dbDel(id) {
    try { const d = await db(); await new Promise((res) => { const tx = d.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {}
  }
  function fromRecord(rec) {
    return { id: rec.id, name: rec.name, cover: rec.cover, demo: false,
      tracks: rec.songs.map(s => ({ title: s.title, url: URL.createObjectURL(s.blob) })) };
  }
  function squareCover(file) {
    return new Promise((res) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const S = 500, c = canvas(S), g = c.getContext('2d'), m = Math.min(img.width, img.height);
        g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }

  function renderOwn() {
    const own = cds.filter(c => !c.demo), list = $('ownList');
    $('ownBox').hidden = !own.length; list.textContent = '';
    own.forEach(cd => {
      const row = document.createElement('div'); row.className = 'own-item';
      const name = document.createElement('span'); name.textContent = `${cd.name} · ${cd.tracks.length} Songs`;
      const del = document.createElement('button'); del.type = 'button'; del.textContent = 'Entfernen';
      del.addEventListener('click', async () => {
        const idx = cds.indexOf(cd);
        if (idx === state.cd) { setPlaying(false); setOpen(false); state.cd = 0; state.track = 0; renderCase(); loadTrack(); }
        else if (idx < state.cd) state.cd--;
        cds.splice(idx, 1); await dbDel(cd.id);
        renderThumbs(); renderOwn();
      });
      row.append(name, del); list.appendChild(row);
    });
  }

  $('addBtn').addEventListener('click', () => { $('err').textContent = ''; renderOwn(); $('sheetWrap').hidden = false; $('cdName').focus(); });
  $('cancelBtn').addEventListener('click', () => { $('sheetWrap').hidden = true; });
  $('sheetWrap').addEventListener('click', (e) => { if (e.target === e.currentTarget) $('sheetWrap').hidden = true; });
  $('sheet').addEventListener('submit', async (e) => {
    e.preventDefault();
    const songs = [...$('cdSongs').files], coverFile = $('cdCover').files[0];
    const name = $('cdName').value.trim() || 'Meine Playlist';
    if (!songs.length) { $('err').textContent = 'Wähle mindestens einen Song aus.'; return; }
    const cover = (coverFile && await squareCover(coverFile)) || coverFromName(name);
    const rec = { id: 'own-' + Date.now(), name, cover,
      songs: songs.map(f => ({ title: f.name.replace(/\.[^.]+$/, ''), blob: f })) };
    const saved = await dbPut(rec);
    cds.push(fromRecord(rec));
    renderThumbs();
    $('sheet').reset();
    $('sheetWrap').hidden = true;
    switchCd(cds.length - 1);
    if (!saved) console.warn('CD konnte nicht dauerhaft gespeichert werden.');
  });

  /* ================= boot ================= */
  renderCase(); loadTrack(); renderThumbs(); setOpen(false);
  dbAll().then(recs => { recs.sort((a, b) => a.id.localeCompare(b.id)).forEach(r => cds.push(fromRecord(r))); renderThumbs(); });
})();
</script>
