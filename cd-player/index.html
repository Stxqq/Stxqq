<title>Jewel CD Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<style>
/* Layout: full-bleed WebGL studio (glass case over a mirror floor), now-playing line and a floating glass dock layered on top.
   Single dark look by choice: a night-time head-unit screen. */
:root {
  --bg: #06070a;
  --fg: #f1f3f7;
  --muted: #8d93a1;
  --glass: rgba(22, 25, 32, .62);
  --glass-line: rgba(255, 255, 255, .09);
  --hover: rgba(255, 255, 255, .08);
  --ink: #f4f5f8;
  --ink-fg: #06070a;
  --glow: #4f7cff;
  --danger: #ff6b7c;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
.app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-inline: 16px; padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 10px; box-sizing: border-box;
  pointer-events: none;
}
.app > * { pointer-events: auto; }
.top {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  pointer-events: none;
}
.top b { color: var(--fg); font-weight: 500; }
.quality { pointer-events: auto; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted);
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 10px; cursor: pointer; }

.hint { font-size: .78rem; color: var(--muted); letter-spacing: .02em; margin: 0; text-align: center; pointer-events: none; }
.np { width: min(560px, 100%); display: grid; gap: 6px; text-align: center; }
.np-cd { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.np-title {
  margin: 0; font-size: clamp(1.2rem, 2.8vw, 1.6rem); font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 0 24px color-mix(in srgb, var(--glow) 55%, transparent);
}
.bar { display: grid; grid-template-columns: 3.2em 1fr 3.2em; align-items: center; gap: 10px; }
.bar span { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar span:last-child { text-align: right; }
.progress { height: 4px; border-radius: 4px; background: var(--hover); position: relative; cursor: pointer; }
.progress::after { content: ""; position: absolute; inset: -12px 0; }
.progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--glow) 60%, var(--fg)), var(--fg));
  box-shadow: 0 0 12px var(--glow);
}

.dock {
  display: flex; align-items: center; gap: 6px; padding: 7px 10px;
  background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-radius: 999px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06);
  max-width: 100%; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
}
.dock::-webkit-scrollbar { display: none; }
.thumbs { display: flex; gap: 4px; }
.thumb, .ctl {
  flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%;
  border: 0; padding: 0; background: transparent; color: var(--fg);
  display: grid; place-items: center; cursor: pointer; position: relative;
}
.thumb i {
  width: 38px; height: 38px; border-radius: 50%;
  background: #333 center / cover; background-image: var(--cover);
  box-shadow: 0 0 0 1px var(--glass-line);
  -webkit-mask: radial-gradient(circle, transparent 0 4px, #000 4.5px);
          mask: radial-gradient(circle, transparent 0 4px, #000 4.5px);
  transition: transform .25s;
}
.thumb:hover i { transform: scale(1.08); }
.thumb[aria-current="true"] i { box-shadow: 0 0 0 2px var(--fg), 0 0 16px var(--glow); }
.sep { width: 1px; height: 28px; background: var(--glass-line); margin-inline: 4px; flex: 0 0 auto; }
.ctl svg { width: 22px; height: 22px; fill: currentColor; }
.ctl.play {
  width: 64px; height: 64px; background: var(--ink); color: var(--ink-fg);
  font-weight: 700; font-size: .95rem; letter-spacing: .04em;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 35%, transparent), 0 0 28px color-mix(in srgb, var(--glow) 70%, transparent);
  transition: box-shadow .4s;
}
.ctl.add { color: var(--muted); }
.ctl:hover:not(.play) { background: var(--hover); }
.thumb:focus-visible, .ctl:focus-visible, .btn:focus-visible, .field input:focus-visible, .quality:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.sheet-wrap {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-inline: 16px;
  background: rgba(6, 7, 10, .6); backdrop-filter: blur(8px);
}
.sheet {
  width: min(440px, 100%); max-height: calc(100% - 32px); overflow-y: auto;
  background: #14161c; border: 1px solid var(--glass-line); border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  padding: 20px; box-sizing: border-box; display: grid; gap: 14px; user-select: text;
}
.sheet h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
.sheet p { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.45; }
.field { display: grid; gap: 6px; font-size: .8rem; font-weight: 500; }
.field input[type="text"] { font: inherit; font-size: .95rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--glass-line); background: var(--bg); color: var(--fg); }
.field input[type="file"] { font: inherit; font-size: .8rem; color: var(--muted); }
.row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { font: inherit; font-size: .9rem; font-weight: 600; padding: 10px 16px; border-radius: 999px; cursor: pointer; border: 1px solid var(--glass-line); background: transparent; color: var(--fg); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.err { color: var(--danger); font-size: .8rem; min-height: 1em; }
.own { display: grid; gap: 6px; border-top: 1px solid var(--glass-line); padding-top: 12px; }
.own h3 { margin: 0; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.own-item { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.own-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.own-item button { font: inherit; font-size: .8rem; color: var(--danger); background: none; border: 0; cursor: pointer; padding: 6px; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; color: var(--muted); }

@media (max-height: 520px) { .hint { display: none; } }
</style>

<canvas id="gl" aria-label="3D CD-Hülle. Antippen öffnet sie und spielt die CD ab."></canvas>
<div class="fail" id="fail" hidden>3D-Grafik wird auf diesem Gerät nicht unterstützt (WebGL 2 fehlt).</div>

<div class="top"><span><b>Jewel</b> · CD Player</span><button class="quality" id="qualityBtn" title="Grafikqualität umschalten">Grafik: Ultra</button></div>

<main class="app" id="app">
  <p class="hint" id="hint">Drücke OK – die Hülle dreht sich und öffnet</p>
  <section class="np" aria-live="polite">
    <div class="np-cd" id="npCd">Fluid · Demo-CD</div>
    <h1 class="np-title" id="npTitle">Nachtfahrt</h1>
    <div class="bar">
      <span id="tCur">0:00</span>
      <div class="progress" id="progress" role="slider" aria-label="Position im Song" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="progress-fill" id="fill"></div></div>
      <span id="tDur">0:00</span>
    </div>
  </section>
  <nav class="dock" aria-label="CDs und Wiedergabe">
    <div class="thumbs" id="thumbs"></div>
    <button class="ctl add" id="addBtn" aria-label="Eigene CD hinzufügen" title="Eigene CD hinzufügen">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <span class="sep"></span>
    <button class="ctl" id="prevBtn" aria-label="Vorheriger Song">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
    </button>
    <button class="ctl play" id="playBtn" aria-label="OK – abspielen"><span id="playIcon">OK</span></button>
    <button class="ctl" id="nextBtn" aria-label="Nächster Song">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </nav>
</main>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <form class="sheet" id="sheet" novalidate>
    <h2>Eigene CD brennen</h2>
    <p>Wähle ein Playlist-Cover und deine Songs. Das Cover wird auf die CD gedruckt.</p>
    <label class="field">Name der Playlist
      <input type="text" id="cdName" maxlength="40" placeholder="z. B. Sommer 2026">
    </label>
    <label class="field">Cover (Bild)
      <input type="file" id="cdCover" accept="image/*">
    </label>
    <label class="field">Songs (MP3, M4A …)
      <input type="file" id="cdSongs" accept="audio/*" multiple>
    </label>
    <div class="err" id="err"></div>
    <div class="row">
      <button type="button" class="btn" id="cancelBtn">Abbrechen</button>
      <button type="submit" class="btn primary">CD erstellen</button>
    </div>
    <div class="own" id="ownBox" hidden>
      <h3>Deine CDs</h3>
      <div id="ownList"></div>
    </div>
  </form>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 3D scene ================= */
const Scene = (() => {
  const canvas = document.getElementById('gl');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    if (!renderer.capabilities.isWebGL2) throw new Error('no webgl2');
  } catch (e) {
    document.getElementById('fail').hidden = false;
    const noop = () => {};
    return { setCover: noop, open: noop, close: noop, swap: (cb) => cb(), setPlaying: noop, hit: () => false, setQuality: noop };
  }
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const BG = 0x06070a;
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 5.5, 13);
  const pmrem = new THREE.PMREMGenerator(renderer);
  /* studio environment: dark room lit by a few HDR light strips, so glass and disc get crisp highlight bars */
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({ color: 0x030304, side: THREE.BackSide })));
  const strip = (w, h, x, y, z, col, ry = 0, rx = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(...col), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); m.lookAt(0, 0, 0); env.add(m);
  };
  strip(7, 1.6, 0, 7, 2, [6, 6, 6.4]);
  strip(.5, 8, -7, 1, 3, [1.2, 4.5, 6]);
  strip(.5, 8, 7, 1, -2, [6, 1.4, 3.2]);
  strip(5, .35, 2, 2.5, 8, [5, 5, 5]);
  strip(.35, 5, -3, 0, 8, [3.5, 3.5, 3.8]);
  strip(9, 2.5, 0, -1, -9, [.35, .38, .5]);
  scene.environment = pmrem.fromScene(env, .02).texture;

  const camera = new THREE.PerspectiveCamera(32, 1, .1, 50);
  const LOOK = new THREE.Vector3(0, -.12, 0);

  /* lights */
  const key = new THREE.SpotLight(0xffffff, 90, 14, .55, .6, 1.6);
  key.position.set(2.6, 3.8, 3.4);
  key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 6; key.shadow.bias = -.0004;
  scene.add(key, key.target);
  const rimA = new THREE.PointLight(0x2ee6ff, 14, 5, 2); rimA.position.set(-2.4, 1.8, -1.4);
  const rimB = new THREE.PointLight(0xff2e88, 14, 5, 2); rimB.position.set(2.4, 1.2, -1.6);
  const glow = new THREE.PointLight(0x4f7cff, 0, 3, 1.8); glow.position.set(0, 0, .25);
  scene.add(rimA, rimB);

  /* floor: real mirror + dark rough coat on top */
  const reflector = new Reflector(new THREE.PlaneGeometry(40, 40), {
    clipBias: .003, textureWidth: 1024, textureHeight: 1024, color: 0x8a8f99 });
  reflector.rotation.x = -Math.PI / 2; reflector.position.y = -1.02;
  const coat = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: BG, roughness: .4, metalness: .2, transparent: true, opacity: .72 }));
  coat.rotation.x = -Math.PI / 2; coat.position.y = -1.015; coat.receiveShadow = true;
  scene.add(reflector, coat);
  // Update the mirror once per frame ourselves: letting it render from inside the
  // glass transmission pass breaks the glass (the disc vanishes behind the lid).
  const updateMirror = reflector.onBeforeRender.bind(reflector);
  reflector.onBeforeRender = () => {};

  /* materials */
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: .03, transmission: 1, thickness: .025, ior: 1.49,
    clearcoat: 1, clearcoatRoughness: .02, specularIntensity: 1, envMapIntensity: 1.8,
    attenuationColor: new THREE.Color(0xd6e4ff), attenuationDistance: 3 });
  const trayMat = glassMat.clone(); trayMat.roughness = .08; trayMat.thickness = .06;
  const ribMat = glassMat.clone(); ribMat.thickness = .03; ribMat.envMapIntensity = 2.2;

  /* case */
  const W = 1.42, H = 1.25, T = .045, LT = .014;
  const root = new THREE.Group(); scene.add(root);
  const body = new THREE.Group(); root.add(body);

  const tray = new THREE.Mesh(new RoundedBoxGeometry(W, H, T, 4, .02), trayMat);
  body.add(tray);
  const rib = (w, h, x, y) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, .02, 2, .005), ribMat); m.position.set(x, y, T / 2 + .008); body.add(m); };
  const inset = .06;
  rib(W - inset * 2, .018, 0, H / 2 - inset); rib(W - inset * 2, .018, 0, -H / 2 + inset);
  rib(.018, H - inset * 2, W / 2 - inset, 0); rib(.018, H - inset * 2, -W / 2 + inset, 0);
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sy]) => {
    rib(.16, .016, sx * (W / 2 - .17), sy * (H / 2 - .1));
    rib(.016, .16, sx * (W / 2 - .1), sy * (H / 2 - .17));
  });
  const rosette = new THREE.Group(); rosette.position.z = T / 2 + .01; body.add(rosette);
  rosette.add(new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, .02, 48).rotateX(Math.PI / 2), ribMat));
  for (let i = 0; i < 10; i++) {
    const tooth = new THREE.Mesh(new RoundedBoxGeometry(.012, .05, .025, 1, .004), ribMat);
    const a = i / 10 * Math.PI * 2; tooth.position.set(Math.cos(a) * .065, Math.sin(a) * .065, 0); tooth.rotation.z = a + Math.PI / 2;
    rosette.add(tooth);
  }

  /* disc */
  const R = .6, RI = .075;
  const disc = new THREE.Group(); disc.position.set(.02, 0, T / 2 + .022); body.add(disc);
  const labelMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: .28, metalness: .12, clearcoat: 1, clearcoatRoughness: .06,
    iridescence: .45, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 700], envMapIntensity: 1.3 });
  const label = new THREE.Mesh(new THREE.RingGeometry(.205, R - .006, 160, 1), labelMat);
  label.castShadow = true; disc.add(label);
  const silver = new THREE.MeshPhysicalMaterial({
    color: 0xdfe3ea, metalness: 1, roughness: .1, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 900] });
  const back = new THREE.Mesh(new THREE.RingGeometry(RI, R, 160, 1), silver);
  back.rotation.y = Math.PI; back.position.z = -.006; disc.add(back);
  const rimEdge = new THREE.Mesh(new THREE.CylinderGeometry(R, R, .007, 160, 1, true).rotateX(Math.PI / 2), silver);
  rimEdge.position.z = -.003; disc.add(rimEdge);
  const outerBand = new THREE.Mesh(new THREE.RingGeometry(R - .006, R, 160, 1), silver); outerBand.position.z = .0005; disc.add(outerBand);
  const hub = new THREE.Mesh(new THREE.RingGeometry(RI, .205, 96, 1), new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: .12, transmission: .95, thickness: .02, ior: 1.5, clearcoat: 1, side: THREE.DoubleSide }));
  disc.add(hub);
  [.1, .135, .2].forEach(r => { const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .0035, 8, 96), silver); ring.position.z = .002; disc.add(ring); });
  disc.add(glow);

  /* lid on a hinge */
  const hinge = new THREE.Group(); hinge.position.set(-W / 2, 0, T / 2 + LT / 2 + .045); body.add(hinge);
  const lid = new THREE.Mesh(new RoundedBoxGeometry(W, H, LT, 4, .006), glassMat); lid.position.x = W / 2; hinge.add(lid);
  const lidRib = (w, h, x, y) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, .008, 2, .003), ribMat); m.position.set(W / 2 + x, y, LT / 2 + .003); hinge.add(m); };
  lidRib(W - .12, .012, 0, H / 2 - .05); lidRib(W - .12, .012, 0, -H / 2 + .05); lidRib(.012, H - .1, W / 2 - .05, 0);
  [H / 2 - .2, -H / 2 + .2].forEach(y => {
    const k = new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, .16, 24), ribMat); k.position.set(0, y, -.02); hinge.add(k);
  });
  const latch = new THREE.Mesh(new RoundedBoxGeometry(.03, .22, .05, 2, .008), ribMat); latch.position.set(W - .005, 0, -.02); hinge.add(latch);

  const pickables = [tray, lid, label, hub, back];

  /* post-processing */
  const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .6, .5, .82);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  let quality = 2, maxDpr = 2;
  function resize() {
    const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio || 1, maxDpr);
    renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
    composer.setPixelRatio(dpr); composer.setSize(w, h);
    camera.aspect = w / h;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max(1.85 / t, 2.0 / (t * camera.aspect));
    camera.position.set(0, .55, dist); camera.lookAt(LOOK);
    camera.setViewOffset(w, h, 0, h * .15, w, h);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  function setQuality(q) {
    quality = q;
    maxDpr = q === 2 ? 2 : q === 1 ? 1.25 : 1;
    bloom.enabled = q >= 1;
    reflector.visible = q >= 1;
    coat.material.opacity = q >= 1 ? .8 : 1;
    renderer.shadowMap.enabled = q >= 1; key.castShadow = q >= 1;
    [glassMat, trayMat, ribMat].forEach(m => { m.transmission = q === 0 ? 0 : 1; m.transparent = q === 0; m.opacity = q === 0 ? .28 : 1; m.needsUpdate = true; });
    resize();
    return ['Eco', 'Hoch', 'Ultra'][q];
  }

  /* animation state */
  const st = { spin: 0, lid: 0, shift: 0, fly: 0, discVel: 0, glow: 0, playing: false };
  const tweens = [];
  const ease = {
    io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    out: t => 1 - Math.pow(1 - t, 3),
    in: t => t * t * t,
    back: t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  function tween(key, to, dur, fn = ease.io, delay = 0) {
    for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].key === key) tweens.splice(i, 1);
    return new Promise(res => tweens.push({ key, from: null, to, dur, fn, t: -delay, res }));
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coverColor = new THREE.Color(0x4f7cff);

  function setCover(url, cb) {
    new THREE.TextureLoader().load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  $('nextBtn').addEventListener('click', () => step(1));
  $('prevBtn').addEventListener('click', () => step(-1));
  $('progress').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    seek(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * duration());
  });
  $('progress').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') seek(Math.min(duration(), elapsed() + 10));
    if (e.key === 'ArrowLeft') seek(Math.max(0, elapsed() - 10));
  });
  document.addEventListener('keydown', (e) => {
    if (!$('sheetWrap').hidden || e.target.closest('input, .progress, button')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setPlaying(!state.playing); }
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', () => setPlaying(true));
      ms.setActionHandler('pause', () => setPlaying(false));
      ms.setActionHandler('nexttrack', () => step(1));
      ms.setActionHandler('previoustrack', () => step(-1));
    } catch (e) {}
  }

  /* ================= own CDs (IndexedDB) ================= */
  const DB = 'jewel-cd', STORE = 'cds';
  function db() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  async function dbAll() {
    try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction(STORE).objectStore(STORE).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch (e) { return []; }
  }
  async function dbPut(rec) {
    try { const d = await db(); await new Promise((res, rej) => { const tx = d.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; }
    catch (e) { return false; }
  }
  async function dbDel(id) {
    try { const d = await db(); await new Promise((res) => { const tx = d.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {}
  }
  function fromRecord(rec) {
    return { id: rec.id, name: rec.name, cover: rec.cover, demo: false,
      tracks: rec.songs.map(s => ({ title: s.title, url: URL.createObjectURL(s.blob) })) };
  }
  function squareCover(file) {
    return new Promise((res) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const S = 500, c = canvas(S), g = c.getContext('2d'), m = Math.min(img.width, img.height);
        g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }

  function renderOwn() {
    const own = cds.filter(c => !c.demo), list = $('ownList');
    $('ownBox').hidden = !own.length; list.textContent = '';
    own.forEach(cd => {
      const row = document.createElement('div'); row.className = 'own-item';
      const name = document.createElement('span'); name.textContent = `${cd.name} · ${cd.tracks.length} Songs`;
      const del = document.createElement('button'); del.type = 'button'; del.textContent = 'Entfernen';
      del.addEventListener('click', async () => {
        const idx = cds.indexOf(cd);
        if (idx === state.cd) { setPlaying(false); setOpen(false); state.cd = 0; state.track = 0; renderCase(); loadTrack(); }
        else if (idx < state.cd) state.cd--;
        cds.splice(idx, 1); await dbDel(cd.id);
        renderThumbs(); renderOwn();
      });
      row.append(name, del); list.appendChild(row);
    });
  }

  $('addBtn').addEventListener('click', () => { $('err').textContent = ''; renderOwn(); $('sheetWrap').hidden = false; $('cdName').focus(); });
  $('cancelBtn').addEventListener('click', () => { $('sheetWrap').hidden = true; });
  $('sheetWrap').addEventListener('click', (e) => { if (e.target === e.currentTarget) $('sheetWrap').hidden = true; });
  $('sheet').addEventListener('submit', async (e) => {
    e.preventDefault();
    const songs = [...$('cdSongs').files], coverFile = $('cdCover').files[0];
    const name = $('cdName').value.trim() || 'Meine Playlist';
    if (!songs.length) { $('err').textContent = 'Wähle mindestens einen Song aus.'; return; }
    const cover = (coverFile && await squareCover(coverFile)) || coverFromName(name);
    const rec = { id: 'own-' + Date.now(), name, cover,
      songs: songs.map(f => ({ title: f.name.replace(/\.[^.]+$/, ''), blob: f })) };
    const saved = await dbPut(rec);
    cds.push(fromRecord(rec));
    renderThumbs();
    $('sheet').reset();
    $('sheetWrap').hidden = true;
    switchCd(cds.length - 1);
    if (!saved) console.warn('CD konnte nicht dauerhaft gespeichert werden.');
  });

  /* ================= boot ================= */
  renderCase(); loadTrack(); renderThumbs(); setOpen(false);
  dbAll().then(recs => { recs.sort((a, b) => a.id.localeCompare(b.id)).forEach(r => cds.push(fromRecord(r))); renderThumbs(); });
})();
</script>
