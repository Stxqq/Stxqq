name: Jewel CD Mac

on:
  push:
    branches: [claude/cd-player]
    paths: ['mac/**', '.github/workflows/jewel-cd-mac.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --package-path mac
