name: Jewel CD APK

on:
  push:
    branches: [claude/cd-player]
    paths: ['android/**', 'cd-player/**', '.github/workflows/jewel-cd-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JewelCD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JewelCD
          path: JewelCD.apk

      - name: Publish as download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jewel-cd-latest
          name: Jewel CD (neueste Version)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Jewel CD für Android-Autoradios. JewelCD.apk herunterladen, auf USB-Stick kopieren
            und im Radio installieren. Gebaut aus Commit ${{ github.sha }}.
          files: JewelCD.apk
